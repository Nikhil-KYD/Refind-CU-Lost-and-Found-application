<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Post Item - ReFind</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- Header -->

    <header>

        <h1>ReFind</h1>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="#">
                Lost Items
            </a>

            <a href="#">
                Found Items
            </a>

        </nav>

    </header>



    <!-- Main Content -->

    <main>

        <section class="post-section">

            <h2 id="postTitle">
                Post an Item
            </h2>

            <p>
                Tell us about the item so its owner
                can find it.
            </p>



            <!-- Post Form -->

            <form id="postForm">


                <!-- Item Name -->

                <label for="itemName">
                    Item Name
                </label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="Example: Black Wallet"
                    required
                >



                <!-- Item Photo -->

             <label for="itemImage">
    Item Photo
</label>

<div class="image-upload">

    <label for="itemImage" class="upload-box">

        <span class="upload-text">
            + Add Photo
        </span>

        <img
            id="imagePreview"
            src=""
            alt="Image Preview"
        >

    </label>

    <input
        type="file"
        id="itemImage"
        accept="image/*"
        required
    >

</div>



                <!-- Category -->

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    required
                >

                    <option value="">
                        Select a category
                    </option>

                    <option value="id-card">
                        ID Card
                    </option>

                    <option value="wallet">
                        Wallet
                    </option>

                    <option value="phone">
                        Phone
                    </option>

                    <option value="laptop">
                        Laptop
                    </option>

                    <option value="earphones">
                        Earphones
                    </option>

                    <option value="keys">
                        Keys
                    </option>

                    <option value="books">
                        Books
                    </option>

                    <option value="clothing">
                        Clothing
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>



                <!-- Location -->

                <label for="location">
                    Where?
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Example: University Library"
                    required
                >



                <!-- Description -->

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe the item..."
                    rows="5"
                    required
                ></textarea>



                <!-- Submit -->

                <button type="submit">
                    Post Item
                </button>


            </form>

        </section>

    </main>



    <!-- Mobile Bottom Navigation -->

    <nav class="bottom-nav">

        <a
            href="index.html"
            class="nav-item"
        >
            <span>
                Home
            </span>
        </a>


        <a
            href="post.html?type=lost"
            class="nav-item active"
        >
            <span>
                Post
            </span>
        </a>


        <a
            href="#"
            class="nav-item"
        >
            <span>
                Profile
            </span>
        </a>

    </nav>



    <!-- JavaScript -->

    <script src="js/post.js"></script>

</body>

</html>
