<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Post Item — ReFind</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <a
            href="index.html"
            class="logo"
        >
            ReFind
        </a>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="#">
                Lost Items
            </a>

            <a href="#">
                Found Items
            </a>

            <a href="#">
                Login
            </a>

        </nav>

    </header>



    <!-- =========================
         POST PAGE
    ========================== -->

    <main>

        <section class="post-container">

            <h2 id="postTitle">
                Post an Item
            </h2>

            <p class="post-subtitle">
                Tell us about the item so its owner can find it.
            </p>


            <!-- =========================
                 FORM
            ========================== -->

            <form id="postForm">


                <!-- ITEM NAME -->

                <label for="itemName">
                    Item Name
                </label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="Example: Black Wallet"
                    required
                >



                <!-- ITEM PHOTO -->

                <label for="itemImage">
                    Item Photo
                </label>

                <div class="image-upload">

                    <label
                        for="itemImage"
                        class="upload-box"
                    >

                        <span class="upload-text">
                            + Add Photo
                        </span>

                        <img
                            id="imagePreview"
                            src=""
                            alt="Selected item photo"
                        >

                    </label>


                    <input
                        type="file"
                        id="itemImage"
                        accept="image/*"
                    >

                </div>



                <!-- CATEGORY -->

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    required
                >

                    <option value="">
                        Select a category
                    </option>

                    <option value="Wallet">
                        Wallet
                    </option>

                    <option value="Phone">
                        Phone
                    </option>

                    <option value="ID Card">
                        ID Card
                    </option>

                    <option value="Keys">
                        Keys
                    </option>

                    <option value="Bag">
                        Bag
                    </option>

                    <option value="Books">
                        Books
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Clothing">
                        Clothing
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>



                <!-- LOCATION -->

                <label for="location">
                    Where?
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Example: University Library"
                    required
                >



                <!-- DESCRIPTION -->

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe the item..."
                    required
                ></textarea>



                <!-- SUBMIT -->

                <button
                    type="submit"
                >
                    Post Item
                </button>

            </form>

        </section>

    </main>



    <!-- =========================
         MOBILE NAVIGATION
    ========================== -->

    <nav class="bottom-nav">

        <a
            href="index.html"
            class="nav-item"
        >
            <span>
                Home
            </span>
        </a>


        <a
            href="post.html?type=lost"
            class="nav-item active"
        >
            <span>
                Post
            </span>
        </a>


        <a
            href="#"
            class="nav-item"
        >
            <span>
                Profile
            </span>
        </a>

    </nav>



    <!-- =========================
         SCRIPTS
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>
    <script src="js/post.js"></script>

</body>

</html>
