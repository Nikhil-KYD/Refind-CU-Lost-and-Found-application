<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReFind</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>ReFind</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="#">Lost Items</a>
            <a href="#">Found Items</a>
            <a href="#">Login</a>
        </nav>
    </header>


    <main>

        <section class="hero">

            <h2>Lost something on campus?</h2>

            <p>
                Find it again with ReFind.
                A simple lost and found platform for Chandigarh University students.
            </p>

            <div class="search-box">
                <input
                    type="text"
                    placeholder="Search for an item..."
                >

                <button>Search</button>
            </div>

            <div class="action-buttons">
    <button id="lostButton">I Lost Something</button>
    <button id="foundButton">I Found Something</button>
</div>

        </section>


        <section class="recent">

            <h2>Recent Items</h2>

            <div class="items">

                <div class="item-card">
                    <div class="item-image"></div>

                    <h3>Black Wallet</h3>

                    <p>Found • Library</p>
                </div>


                <div class="item-card">
                    <div class="item-image"></div>

                    <h3>Blue Water Bottle</h3>

                    <p>Lost • Block 4</p>
                </div>


                <div class="item-card">
                    <div class="item-image"></div>

                    <h3>Wireless Earphones</h3>

                    <p>Found • Cafeteria</p>
                </div>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
