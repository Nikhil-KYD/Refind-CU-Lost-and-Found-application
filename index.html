<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReFind — Chandigarh University</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <a href="index.html" class="logo">
            ReFind
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="#">Lost Items</a>
            <a href="#">Found Items</a>
            <a href="#">Login</a>
        </nav>

    </header>


    <!-- =========================
         HERO
    ========================== -->

    <main>

        <section class="hero">

            <h1>
                Lost something<br>
                on campus?
            </h1>

            <p>
                Find it again with ReFind.
                A simple lost and found platform
                for Chandigarh University students.
            </p>


            <!-- =========================
                 SEARCH
            ========================== -->

            <div class="search-box">

                <input
                    type="text"
                    placeholder="Search for an item..."
                    aria-label="Search for an item"
                >

                <button type="button">
                    Search
                </button>

            </div>


            <!-- =========================
                 LOST / FOUND
            ========================== -->

            <div class="actions">

                <button id="lostButton" type="button">

                    <span class="action-icon">
                        ↗
                    </span>

                    <span class="action-title">
                        I lost something
                    </span>

                    <span class="action-subtitle">
                        Help me find it
                    </span>

                </button>


                <button id="foundButton" type="button">

                    <span class="action-icon">
                        ✓
                    </span>

                    <span class="action-title">
                        I found something
                    </span>

                    <span class="action-subtitle">
                        Help return it
                    </span>

                </button>

            </div>

        </section>


        <!-- =========================
             RECENT ITEMS
        ========================== -->

        <section class="recent">

            <h2>
                Recent Items
            </h2>

            <div
                class="items"
                id="itemsContainer"
            >

                <p id="loadingItems">
                    Loading items...
                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         MOBILE NAVIGATION
    ========================== -->

    <nav class="bottom-nav">

        <a
            href="index.html"
            class="nav-item active"
        >
            <span>
                Home
            </span>
        </a>


        <a
            href="post.html?type=lost"
            class="nav-item"
        >
            <span>
                Post
            </span>
        </a>


        <a
            href="#"
            class="nav-item"
        >
            <span>
                Profile
            </span>
        </a>

    </nav>


    <!-- =========================
         SCRIPTS
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>


    <script src="js/app.js"></script>

</body>

</html>
